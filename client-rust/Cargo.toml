[workspace]
resolver = "2"
members = ["mcp-client", "spil-backend"]

[workspace.package]
version = "1.0.0"
edition = "2021"
license = "MIT"

[workspace.dependencies]
rmcp = { version = "3.8.0", default-features = false, features = ["client", "transport-child-process"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "process", "io-util", "sync", "time"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"

[profile.release]
lto = "thin"
codegen-units = 4
